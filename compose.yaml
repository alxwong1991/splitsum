name: splitsum

services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: splitsum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: splitsum
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init-test-database.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitsum -d splitsum"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
